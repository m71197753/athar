import groovy.json.JsonOutput

plugins {
    id "com.android.application"
}

def websiteUrl = providers.gradleProperty("ATHAR_APP_URL").getOrElse("").trim()

android {
    namespace "app.athar.students"
    compileSdk 35

    defaultConfig {
        applicationId "app.athar.students"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "APP_URL", JsonOutput.toJson(websiteUrl)
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "androidx.browser:browser:1.8.0"
    testImplementation "junit:junit:4.13.2"
}
