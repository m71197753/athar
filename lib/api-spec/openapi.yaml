          description: Saved questions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AcademyQuestion" }
        "400": { description: Invalid question bank }
        "403": { description: Administrator access required }
        "404": { description: Exam not found }
  /career-plan:
    get:
      operationId: getCareerPlan
      tags: [roadmap]
      summary: Get the current student's career plan and action items
      responses:
        "200":
          description: Career plan and its action items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerPlanOverview"
        "401":
          description: Authentication required
    put:
      operationId: saveCareerPlan
      tags: [roadmap]
      summary: Save the current student's career goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerPlanInput"
      responses:
        "200":
          description: Saved career plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerPlan"
        "400":
          description: Invalid career plan
        "401":
          description: Authentication required
  /career-plan/tasks/batch:
    post:
      operationId: createCareerTasks
      tags: [roadmap]
      summary: Add selected action items to the current student's plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerTasksInput"
      responses:
        "201":
          description: Saved action items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CareerTask"
        "400":
          description: Invalid action items or no saved career goal
        "401":
          description: Authentication required
  /career-plan/reminder/push-config:
    get:
      operationId: getCareerPushConfig
      tags: [career]
      summary: Get the Web Push application server public key
      responses:
        "200":
          description: Push delivery configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerPushConfig"
        "401":
          description: Authentication required
        "503":
          description: Push delivery is not configured
  /career-plan/reminder:
    put:
      operationId: saveCareerReminder
      tags: [roadmap]
      summary: Enable or disable a weekly reminder linked to a career action item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerReminderInput"
      responses:
        "200":
          description: Saved weekly reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerReminder"
        "400":
          description: Invalid reminder or selected action item
        "503":
          description: Push delivery is not configured
        "401":
          description: Authentication required
  /career-plan/reminder/snooze:
    post:
      operationId: snoozeCareerReminder
      tags: [roadmap]
      summary: Reschedule the next weekly reminder
      responses:
        "200":
          description: Reminder rescheduled for next week
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerReminder"
        "400":
          description: No active reminder
        "401":
          description: Authentication required
  /career-plan/tasks/{id}:
    patch:
      operationId: updateCareerTask
      tags: [roadmap]
      summary: Update an action item or mark it complete
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerTaskUpdate"
      responses:
        "200":
          description: Updated action item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerTask"
        "400":
          description: Invalid action item
        "404":
          description: Action item not found
        "401":
          description: Authentication required
    delete:
      operationId: deleteCareerTask
      tags: [roadmap]
      summary: Delete an action item
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Action item deleted
        "404":
          description: Action item not found
        "401":
          description: Authentication required
  /ai/career-plan-suggestions:
    post:
      operationId: generateCareerPlanSuggestions
      tags: [ai]
      summary: Suggest a focused career plan based on the student's saved skills and achievements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerPlanSuggestionsInput"
      responses:
        "200":
          description: Suggested career plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerPlanSuggestions"
        "400":
          description: Invalid request
        "401":
          description: Authentication required
  /academy/course-submissions:
    get:
      operationId: listMyAcademyCourseSubmissions
      tags: [learning]
      summary: List the authenticated member's course submissions
      responses:
        "200":
          description: The member's submissions and review states
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademyCourseSubmissionList" }
        "401": { description: Authentication required }
    post:
      operationId: submitAcademyCourseLink
      tags: [learning]
      summary: Submit a course link for administrator review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcademyCourseLinkSubmissionInput" }
      responses:
        "201":
          description: The link is pending review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademyCourseSubmission" }
        "400": { description: Invalid course link }
        "401": { description: Authentication required }
  /academy/course-submissions/upload-url:
    post:
      operationId: requestAcademyCourseSubmissionUpload
      tags: [learning]
      summary: Request a private upload URL for a course file
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcademyCourseFileSubmissionInput" }
      responses:
        "201":
          description: Upload URL and pending submission identifier
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademyCourseUploadUrlResponse" }
        "400": { description: Invalid file metadata }
        "401": { description: Authentication required }
  /academy/course-submissions/{submissionId}/confirm:
    post:
      operationId: confirmAcademyCourseSubmissionUpload
      tags: [learning]
      summary: Verify an uploaded course file before review
      parameters:
        - in: path
          name: submissionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The file is safely stored and awaiting review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademyCourseSubmission" }
        "400": { description: Invalid or incomplete upload }
        "401": { description: Authentication required }
        "404": { description: Submission not found }
  /academy/community-courses:
    get:
      operationId: listApprovedAcademyCommunityCourses
      tags: [learning]
      summary: List member-submitted courses approved for sharing
      responses:
        "200":
          description: Approved resources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademyCommunityCourseList" }
        "401": { description: Authentication required }
  /academy/community-courses/{submissionId}/download:
    get:
      operationId: downloadApprovedAcademyCommunityCourse
      tags: [learning]
      summary: Download a file from an approved course submission
      parameters:
        - in: path
          name: submissionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Approved course file }
        "401": { description: Authentication required }
        "404": { description: Course file not found }
  /admin/academy/course-submissions:
    get:
      operationId: listAdminAcademyCourseSubmissions
      tags: [admin]
      summary: List course resources awaiting or completed review
      responses:
        "200":
          description: Course submission review queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAcademyCourseSubmissionList" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/academy/course-submissions/{submissionId}/review:
    patch:
      operationId: reviewAdminAcademyCourseSubmission
      tags: [admin]
      summary: Approve or reject a member-submitted course resource
      parameters:
        - in: path
          name: submissionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcademyCourseSubmissionReviewInput" }
      responses:
        "200":
          description: Updated review state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademyCourseSubmission" }
        "400": { description: Invalid review decision }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "404": { description: Submission not found }
  /admin/academy/course-submissions/{submissionId}/download:
    get:
      operationId: downloadAdminAcademyCourseSubmission
      tags: [admin]
      summary: Review a private submitted course file
      parameters:
        - in: path
          name: submissionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Submitted course file for review }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "404": { description: Submission file not found }
  /graduates/items:
    get:
      operationId: listGraduateItems
      tags: [graduates]
      summary: List published opportunities, guidance and community posts
      responses:
        "200":
          description: Published graduate hub content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraduateItemList" }
        "401": { description: Authentication required }
  /graduates/community:
    post:
      operationId: submitGraduateCommunityPost
      tags: [graduates]
      summary: Submit a community post for administrator review
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GraduateCommunityPostInput" }
      responses:
        "201":
          description: Post is waiting for review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraduateSubmissionResponse" }
        "400": { description: Invalid community post }
        "401": { description: Authentication required }
  /admin/graduates/items:
    get:
      operationId: listAdminGraduateItems
      tags: [admin]
      summary: List graduate hub content and community submissions
      responses:
        "200":
          description: Editable graduate hub content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminGraduateItemList" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
    post:
      operationId: createAdminGraduateItem
      tags: [admin]
      summary: Publish an opportunity or guidance resource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminGraduateItemInput" }
      responses:
        "201":
          description: Published graduate resource
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminGraduateItem" }
        "400": { description: Invalid graduate content }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/graduates/items/{itemId}:
    patch:
      operationId: reviewAdminGraduateItem
      tags: [admin]
      summary: Edit, publish or reject a graduate community item
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminGraduateItemUpdate" }
      responses:
        "200":
          description: Updated graduate content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminGraduateItem" }
        "400": { description: Invalid graduate update }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "404": { description: Graduate item not found }
    delete:
      operationId: deleteAdminGraduateItem
      tags: [admin]
      summary: Remove a graduate hub item
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Graduate item removed }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "404": { description: Graduate item not found }

components:
  schemas:
    AdPage:
      type: string
      enum: [home, dashboard, achievements, learning, academy, roadmap, resume, assistant, profile]
    AdSlot:
      type: string
      enum: [top, middle, bottom, side, floating-start, floating-end]
    AdPlacement:
      type: object
      additionalProperties: false
      required: [page, slot, offsetX, offsetY, width, height]
      properties:
        page: { $ref: "#/components/schemas/AdPage" }
        slot: { $ref: "#/components/schemas/AdSlot" }
        offsetX: { type: integer, minimum: 0, maximum: 200 }
        offsetY: { type: integer, minimum: 0, maximum: 200 }
        width: { type: integer, minimum: 180, maximum: 1200 }
        height: { type: integer, minimum: 100, maximum: 800 }
    AdCreativeInput:
      type: object
      required: [title, format, mediaUrl, code, destination, cta, placements]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        format: { type: string, enum: [image_link, video_link, code, image_code, text_link] }
        mediaUrl: { type: string, maxLength: 2000 }
        code: { type: string, maxLength: 100000 }
        destination: { type: string, maxLength: 2000 }
        cta: { type: string, minLength: 1, maxLength: 60 }
        placements:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: "#/components/schemas/AdPlacement" }
    AdInput:
      allOf:
        - { $ref: "#/components/schemas/AdCreativeInput" }
        - type: object
          required: [status, customerId, startsAt, endsAt]
          properties:
            status: { type: string, enum: [draft, active, paused, archived] }
            customerId: { type: [string, "null"], format: uuid }
            startsAt: { type: [string, "null"], format: date-time }
            endsAt: { type: [string, "null"], format: date-time }
    ClassifiedAd:
      allOf:
        - { $ref: "#/components/schemas/AdInput" }
        - type: object
          required: [id, updatedAt]
          properties:
            id: { type: string }
            updatedAt: { type: string }
    PublicAd:
      allOf:
        - { $ref: "#/components/schemas/AdCreativeInput" }
        - type: object
          required: [id]
          properties:
            id: { type: string }
    AdCustomerInput:
      type: object
      additionalProperties: false
      required: [name, email, phone, notes]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        email: { type: string, maxLength: 254 }
        phone: { type: string, maxLength: 60 }
        notes: { type: string, maxLength: 2000 }
    AdCustomer:
      allOf:
        - { $ref: "#/components/schemas/AdCustomerInput" }
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: string }
            createdAt: { type: string }
    AdMetric:
      type: object
      required: [impressions, clicks, visitors, enquiries, ctr]
      properties:
        impressions: { type: integer }
        clicks: { type: integer }
        visitors: { type: integer }
        enquiries: { type: integer }
        ctr: { type: number }
    AdBreakdown:
      allOf:
        - { $ref: "#/components/schemas/AdMetric" }
        - type: object
          required: [id, title]
          properties:
            id: { type: string }
            title: { type: string }
    AdDaily:
      allOf:
        - { $ref: "#/components/schemas/AdMetric" }
        - type: object
          required: [date]
          properties:
            date: { type: string }
    AdEnquiry:
      type: object
      required: [id, adId, adTitle, name, contact, message, status, createdAt]
      properties:
        id: { type: string }
        adId: { type: string }
        adTitle: { type: string }
        name: { type: string }
        contact: { type: string }
        message: { type: string }
        status: { type: string, enum: [new, contacted, converted, closed] }
        createdAt: { type: string }
    AdStatistics:
      type: object
      required: [updatedAt, days, totals, byAd, byCustomer, daily, leads]
      properties:
        updatedAt: { type: string }
        days: { type: integer }
        totals: { $ref: "#/components/schemas/AdMetric" }
        byAd: { type: array, items: { $ref: "#/components/schemas/AdBreakdown" } }
        byCustomer: { type: array, items: { $ref: "#/components/schemas/AdBreakdown" } }
        daily: { type: array, items: { $ref: "#/components/schemas/AdDaily" } }
        leads: { type: array, items: { $ref: "#/components/schemas/AdEnquiry" } }
    AdEventInput:
      type: object
      additionalProperties: false
      required: [kind, page, slot]
      properties:
        kind: { type: string, enum: [impression, click] }
        page: { $ref: "#/components/schemas/AdPage" }
        slot: { $ref: "#/components/schemas/AdSlot" }
    AdEnquiryInput:
      type: object
      additionalProperties: false
      required: [name, contact, message, consent]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        contact: { type: string, minLength: 3, maxLength: 254 }
        message: { type: string, maxLength: 2000 }
        consent: { type: boolean }
    AdEnquiryUpdate:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [new, contacted, converted, closed] }
    AdAssetInput:
      type: object
      additionalProperties: false
      required: [mime, size]
      properties:
        mime: { type: string, enum: [image/jpeg, image/png, image/webp, image/gif, video/mp4, video/webm] }
        size: { type: integer, minimum: 1 }
    AdAssetUpload:
      type: object
      required: [id, uploadUrl]
      properties:
        id: { type: string }
        uploadUrl: { type: string }
    AdAssetReady:
      type: object
      required: [url]
      properties:
        url: { type: string }
    ModuleKey:
      type: string
      enum: [achievements, learning, academy, languages, graduates, roadmap, resume, assistant]
    SectionIconKey:
      type: string
      enum: [book, file, graduation, briefcase, target, sparkles, languages, award, layers, route, globe, code, heart, users]
    SectionAccentKey:
      type: string
      enum: [teal, green, blue, indigo, violet, amber, rose]
    SectionCardStyle:
      type: string
      enum: [soft, outlined, gradient]
    ModuleSetting:
      type: object
      additionalProperties: false
      required: [key, title, description, enabled, sortOrder]
      properties:
        key: { $ref: "#/components/schemas/ModuleKey" }
        title: { type: string, minLength: 2, maxLength: 80 }
        description: { type: string, maxLength: 240 }
        enabled: { type: boolean }
        sortOrder: { type: integer, minimum: 0, maximum: 999 }
        iconKey: { $ref: "#/components/schemas/SectionIconKey" }
        accentKey: { $ref: "#/components/schemas/SectionAccentKey" }
        cardStyle: { $ref: "#/components/schemas/SectionCardStyle" }
        blocks:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/SectionBlock" }
    PlatformSettings:
      type: object
      additionalProperties: false
      required: [moduleSettings, appearance]
      properties:
        moduleSettings:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ModuleSetting" }
        appearance: { $ref: "#/components/schemas/AppearanceSettings" }
    AppearanceSettings:
      type: object
      additionalProperties: false
      required: [primaryColor, accentColor, canvasColor, surfaceColor, welcomeTitle, welcomeDescription]
      properties:
        primaryColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        accentColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        canvasColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        surfaceColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        fontFamily: { type: string, enum: [IBM Plex Sans Arabic, Cairo, Tahoma, Arial] }
        fontScale: { type: integer, minimum: 90, maximum: 130 }
        textColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        headingColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        cardTextColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        cardBorderColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        iconColor: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
        iconShape: { type: string, enum: [rounded, circle, square] }
        welcomeTitle: { type: string, minLength: 2, maxLength: 80 }
        welcomeDescription: { type: string, minLength: 2, maxLength: 220 }
    PlatformAccess:
      type: object
      required: [userId, role, status, enabledModules]
      properties:
        userId: { type: string }
        role: { type: string, enum: [student, admin] }
        status: { type: string, enum: [active, suspended] }
        enabledModules:
          type: array
          items: { $ref: "#/components/schemas/ModuleKey" }
    AdminUser:
      type: object
      required: [userId, name, email, verified, role, status, createdAt, shared]
      properties:
        userId: { type: string }
        name: { type: string }
        email: { type: string }
        verified: { type: boolean }
        role: { type: string, enum: [student, admin] }
        status: { type: string, enum: [active, suspended] }
        createdAt: { type: string }
        shared: { type: boolean }
    MemberUpdate:
      type: object
      additionalProperties: false
      required: [role, status]
      properties:
        role: { type: string, enum: [student, admin] }
        status: { type: string, enum: [active, suspended] }
    AdminUserPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    AdminOverview:
      type: object
      required: [accounts, students, achievements, learningItems, careerPlans, activeShares, admins, suspended]
      properties:
        accounts: { type: integer }
        students: { type: integer }
        achievements: { type: integer }
        learningItems: { type: integer }
        careerPlans: { type: integer }
        activeShares: { type: integer }
        admins: { type: integer }
        suspended: { type: integer }
    AdminOverviewDetailsKind:
      type: string
      enum: [accounts, students, admins, suspended, achievements, learningItems, careerPlans, activeShares]
    AdminOverviewDetailsItem:
      type: object
      additionalProperties: false
      required: [id, title, subtitle, ownerId, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        subtitle: { type: string }
        ownerId: { type: string }
        updatedAt: { type: string }
    AdminOverviewDetails:
      type: object
      additionalProperties: false
      required: [kind, items, total, page, pageSize]
      properties:
        kind: { $ref: "#/components/schemas/AdminOverviewDetailsKind" }
        items: { type: array, items: { $ref: "#/components/schemas/AdminOverviewDetailsItem" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    AdminAchievementEvidenceItem:
      type: object
      additionalProperties: false
      required: [id, achievementId, studentName, studentUniversity, studentMajor, achievementTitle, kind, title, content, url, originalName, mime, size, status, downloadUrl, createdAt]
      properties:
        id: { type: string, format: uuid }
        achievementId: { type: string, format: uuid }
        studentName: { type: string }
        studentUniversity: { type: string }
        studentMajor: { type: string }
        achievementTitle: { type: string }
        kind: { type: string }
        title: { type: string }
        content: { type: ["string", "null"] }
        url: { type: ["string", "null"] }
        originalName: { type: ["string", "null"] }
        mime: { type: ["string", "null"] }
        size: { type: ["integer", "null"], minimum: 1 }
        status: { type: string }
        downloadUrl: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    AdminAchievementEvidencePage:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminAchievementEvidenceItem" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    SectionMediaUploadInput:
      type: object
      additionalProperties: false
      required: [originalName, mime, size]
      properties:
        originalName: { type: string, minLength: 1, maxLength: 240 }
