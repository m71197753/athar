openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: student
    description: Student profile and portfolio operations
  - name: roadmap
    description: Student career goals and action plans
  - name: learning
    description: Student courses, lectures, and academy progress
  - name: ai
    description: Optional AI-assisted career writing
paths:
  /admin/ads:
    get:
      operationId: listAdminAds
      responses:
        "200":
          description: All advertisements including drafts and archived campaigns
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ClassifiedAd" } }
    post:
      operationId: createAdminAd
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassifiedAd" }
  /admin/ads/{id}:
    put:
      operationId: updateAdminAd
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassifiedAd" }
    delete:
      operationId: archiveAdminAd
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Archived without destroying reporting history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
  /admin/ad-customers:
    get:
      operationId: listAdCustomers
      responses:
        "200":
          description: Advertiser customers
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdCustomer" } }
    post:
      operationId: createAdCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdCustomerInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdCustomer" }
  /admin/ad-customers/{id}:
    put:
      operationId: updateAdCustomer
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdCustomerInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdCustomer" }
    delete:
      operationId: deleteAdCustomer
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Removed; associated ads retained with customer cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
  /admin/ad-statistics:
    get:
      operationId: getAdStatistics
      parameters:
        - { name: days, in: query, schema: { type: integer, enum: [7, 30, 90], default: 30 } }
      responses:
        "200":
          description: Live database aggregates and most recent enquiries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdStatistics" }
  /admin/ad-enquiries/{id}:
    patch:
      operationId: updateAdEnquiry
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdEnquiryUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
  /admin/ad-assets:
    post:
      operationId: requestAdAssetUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdAssetInput" }
      responses:
        "201":
          description: Direct upload URL valid for fifteen minutes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdAssetUpload" }
  /admin/ad-assets/{id}/confirm:
    post:
      operationId: confirmAdAsset
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Media validated and ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdAssetReady" }
  /ads:
    get:
      operationId: getPublishedAds
      parameters:
        - { name: page, in: query, required: true, schema: { $ref: "#/components/schemas/AdPage" } }
      responses:
        "200":
          description: Scheduled active creatives for this page; never private customer information
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PublicAd" } }
  /ads/{id}/events:
    post:
      operationId: recordAdEvent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdEventInput" }
      responses:
        "200":
          description: Event accepted or deduplicated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
  /ads/{id}/enquiries:
    post:
      operationId: createAdEnquiry
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdEnquiryInput" }
      responses:
        "201":
          description: Enquiry saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
  /ads/media/{id}:
    get:
      operationId: getAdMedia
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Validated image or video bytes }
        "206": { description: Video range bytes }
  /access:
    get:
      operationId: getPlatformAccess
      responses:
        "200":
          description: Current member access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformAccess" }
        "401": { description: Sign in required }
        "403": { description: Suspended }
  /platform:
    get:
      operationId: getPlatformContent
      responses:
        "200":
          description: Published resources, sections, and platform configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformContent" }
  /admin/overview:
    get:
      operationId: getAdminOverview
      responses:
        "200":
          description: Platform totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
  /admin/overview/details:
    get:
      operationId: getAdminOverviewDetails
      parameters:
        - { name: kind, in: query, required: true, schema: { $ref: "#/components/schemas/AdminOverviewDetailsKind" } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Paginated records behind an overview total
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverviewDetails" }
  /admin/achievement-evidence:
    get:
      operationId: listAdminAchievementEvidence
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Paginated student achievement evidence for active administrators
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAchievementEvidencePage" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/users:
    get:
      operationId: listAdminUsers
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Paginated authentication accounts and application roles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserPage" }
  /admin/users/{userId}:
    patch:
      operationId: updateAdminUser
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberUpdate" }
      responses:
        "200":
          description: Membership updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
        "409": { description: Self-change or last-admin protection }
    delete:
      operationId: revokeAdminUserShare
      summary: Revoke a user's public portfolio link, without deleting their data
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Public share revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
  /admin/content:
    get:
      operationId: getAdminContent
      responses:
        "200":
          description: All content, including drafts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedContent" }
    post:
      operationId: createAdminContent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentEntry" }
  /admin/content/{id}:
    put:
      operationId: updateAdminContent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentEntry" }
    delete:
      operationId: deleteAdminContent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
  /admin/settings:
    get:
      operationId: getAdminSettings
      responses:
        "200":
          description: Section access settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformSettings" }
    put:
      operationId: saveAdminSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformSettings" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformSettings" }
  /admin/language/settings:
    get:
      operationId: getAdminLanguageSettings
      responses:
        "200":
          description: Language page and game rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanguagePlatformSettings" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
    put:
      operationId: updateAdminLanguageSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LanguagePlatformSettingsInput" }
      responses:
        "200":
          description: Updated language page and game rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanguagePlatformSettings" }
        "400": { description: Invalid language settings }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/language/content:
    get:
      operationId: listAdminLanguageContent
      parameters:
        - { name: languageCode, in: query, required: true, schema: { type: string, enum: [en, fr, es, de, tr] } }
        - { name: level, in: query, required: true, schema: { type: string, enum: [A1, A2, B1, B2] } }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: search, in: query, required: false, schema: { type: string, maxLength: 100 } }
        - { name: includeArchived, in: query, required: false, schema: { type: boolean, default: true } }
      responses:
        "200":
          description: Paged language curriculum items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanguageContentList" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
    post:
      operationId: createAdminLanguageContent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LanguageContentItemInput" }
      responses:
        "201":
          description: Language curriculum item created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanguageContentItem" }
        "400": { description: Invalid language content }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/language/content/import:
    post:
      operationId: importAdminLanguageContent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LanguageContentImportInput" }
      responses:
        "201":
          description: Language curriculum batch imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanguageContentImportResponse" }
        "400":
          description: Invalid language content batch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanguageContentImportError" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "409":
          description: Batch contains content already in the library
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanguageContentImportError" }
  /admin/language/content/{id}:
    patch:
      operationId: updateAdminLanguageContent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 120 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LanguageContentItemUpdate" }
      responses:
        "200":
          description: Language curriculum item updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LanguageContentItem" }
        "400": { description: Invalid language content }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "404": { description: Language item not found }
        "409": { description: Item already has learning history and cannot be moved }
  /admin/section-media/{id}/preview:
    get:
      operationId: getAdminSectionMediaPreview
      tags: [admin]
      summary: Privately preview a verified section attachment before publishing
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Private attachment bytes; supports native media range requests
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { description: Authentication required }
        "403": { description: Administrator required }
        "404": { description: Attachment not found }
  /admin/section-media/uploads:
    post:
      operationId: requestSectionMediaUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SectionMediaUploadInput" }
      responses:
        "201":
          description: Short-lived direct upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SectionMediaUploadRequest" }
        "400": { description: Unsupported file or size }
  /admin/section-media/cleanup-preview:
    get:
      operationId: previewSectionMediaCleanup
      responses:
        "200":
          description: Count old unattached section uploads without exposing storage paths
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SectionMediaCleanupPreview" }
        "403": { description: Admin access required }
  /admin/section-media/cleanup:
    post:
      operationId: cleanupSectionMedia
      responses:
        "200":
          description: Remove eligible old unlinked section uploads
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SectionMediaCleanupResult" }
        "403": { description: Admin access required }
  /admin/section-media/uploads/{id}/confirm:
    post:
      operationId: confirmSectionMediaUpload
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Verified media asset URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SectionMediaUploadResult" }
        "400": { description: Uploaded bytes do not match the requested type }
        "404": { description: Upload not found }
  /platform/section-media/{id}:
    get:
      operationId: getPlatformSectionMedia
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Public media used by published platform sections
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: Media not found }
  /admin/sections:
    get:
      operationId: listAdminSections
      responses:
        "200":
          description: All custom sections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSectionList" }
    post:
      operationId: createAdminSection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SectionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformSection" }
        "400": { description: Invalid section }
  /admin/sections/{id}:
    put:
      operationId: updateAdminSection
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SectionInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformSection" }
        "400": { description: Invalid section }
        "404": { description: Not found }
    delete:
      operationId: deleteAdminSection
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
        "404": { description: Not found }
  /sections/{slug}/courses/{courseId}/complete:
    post:
      operationId: completePlatformSectionCourse
      tags: [learning]
      summary: Record a student's completion of a published platform course
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, pattern: '^section-[a-f0-9]{12}$' } }
        - { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Course completion saved to the student's learning history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearningItem" }
        "401": { description: Sign-in required }
        "404": { description: Published course not found }
  /sections/{slug}/courses/{courseId}/position:
    get:
      operationId: getCoursePosition
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 120 } }
        - { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Private last selected lesson, not a completion record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoursePosition" }
        "404": { description: Published course not found }
    put:
      operationId: saveCoursePosition
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 120 } }
        - { name: courseId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CoursePositionInput" }
      responses:
        "200":
          description: Last selected lesson saved for the authenticated student
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoursePosition" }
        "409": { description: Lesson changed or cannot be uniquely identified }
  /sections/{slug}/media-progress:
    get:
      operationId: getSectionMediaProgress
      tags: [learning]
      summary: Get the current student's playback progress in a published section
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, minLength: 2, maxLength: 80 } }
      responses:
        "200":
          description: Private playback progress for this student and section
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SectionMediaProgress" }
        "401": { description: Sign-in required }
        "404": { description: Published section not found }
    put:
      operationId: saveSectionMediaProgress
      tags: [learning]
      summary: Save playback time for a video or audio file in a published section
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, minLength: 2, maxLength: 80 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SectionMediaProgressInput" }
      responses:
        "200":
          description: Playback progress saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SectionMediaProgress" }
        "400": { description: Invalid playback progress }
        "401": { description: Sign-in required }
        "404": { description: Published media not found }
  /admin/audit:
    get:
      operationId: listAdminAudit
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Paginated administrative activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
  /admin/notifications:
    get:
      operationId: listAdminNotifications
      tags: [admin]
      summary: List notifications for the authenticated administrator
      responses:
        "200":
          description: Recent notifications and unread count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminNotificationList" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/notifications/read-all:
    patch:
      operationId: markAllAdminNotificationsRead
      tags: [admin]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Number of notifications marked as read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkAllAdminNotificationsReadResult" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
  /admin/notifications/{notificationId}/read:
    patch:
      operationId: markAdminNotificationRead
      tags: [admin]
      summary: Mark one administrator notification as read
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminNotification" }
        "401": { description: Authentication required }
        "403": { description: Administrator access required }
        "404": { description: Notification not found }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [student]
      summary: Get the student's dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Authentication required
  /student/profile:
    get:
      operationId: getStudentProfile
      tags: [student]
      summary: Get the current student's profile
      responses:
        "200":
          description: Student profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "404":
          description: Profile not found
        "401":
          description: Authentication required
    put:
      operationId: saveStudentProfile
      tags: [student]
      summary: Create or update the current student's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
