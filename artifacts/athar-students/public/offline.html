<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d6f72">
  <title>أثر — لا يوجد اتصال</title>
  <style>
    :root{color-scheme:light dark}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;font:18px/1.9 system-ui;background:#f6f9fb;color:#1a2f45}
    main{max-width:420px;padding:30px;text-align:center}
    img{width:80px}p{color:#5b6b7b}button{font:inherit;background:#1d6f72;color:white;border:0;border-radius:12px;padding:10px 24px;cursor:pointer}
    @media(prefers-color-scheme:dark){body{background:#0f1a27;color:#e8eef3}p{color:#b3c1cf}img{background:#eef4f6;border-radius:18px}}
  </style>
</head>
<body><main>
  <h1>أنت غير متصل بالإنترنت</h1>
  <p>يحتاج أثر إلى اتصال لعرض بياناتك وحفظ التعديلات. اتصل بالإنترنت ثم أعد المحاولة.</p>
  <button type="button" onclick="location.reload()">إعادة المحاولة</button>
</main></body>
</html>
