kind = "video"
videoAspectRatio = "16:9"
previewPath = "/athar-animated-presentation/"
title = "أثر | العرض المتحرك"
description = "فيديو عرض تلقائي عن فكرة منصة أثر وخصائصها، مبني على عرض الشرائح المعتمد مع الأسماء والشعارات المرفقة."
version = "1.0.0"
id = "artifacts/athar-animated-presentation"
router = "path"

[[services]]
name = "web"
paths = [ "/athar-animated-presentation/" ]
localPort = 23039

[services.development]
run = "pnpm --filter @workspace/athar-animated-presentation run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/athar-animated-presentation", "run", "build" ]
serve = "static"
publicDir = "artifacts/athar-animated-presentation/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23039"
BASE_PATH = "/athar-animated-presentation/"
